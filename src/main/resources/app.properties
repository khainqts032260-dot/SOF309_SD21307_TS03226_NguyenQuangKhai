# Có th\u1EC3 ghi \u0111è m\u1ECDi giá tr\u1ECB b\u1EB1ng bi\u1EBFn môi tr\u01B0\u1EDDng cùng tên vi\u1EBFt hoa
# và thay d\u1EA5u ch\u1EA5m b\u1EB1ng d\u1EA5u g\u1EA1ch d\u01B0\u1EDBi.

# ======================== APP ========================
app.baseUrl=http://localhost:8080/celine-closset-web
app.devMode=true

# ======================== GOOGLE OAUTH ========================
# N\u1EBFu ch\u01B0a dùng \u0111\u0103ng nh\u1EADp Google thì có th\u1EC3 \u0111\u1EC3 tr\u1ED1ng.
google.clientId=
google.clientSecret=
google.redirectUri=http://localhost:8080/celine-closset-web/auth/google/callback

# ======================== QUÊN M\u1EACT KH\u1EA8U KHÁCH HÀNG ========================
# Ch\u1EC9 áp d\u1EE5ng cho vai trò CUSTOMER.
# Gmail ph\u1EA3i b\u1EADt xác minh 2 b\u01B0\u1EDBc và dùng App Password 16 ký t\u1EF1.
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=
smtp.password=
# N\u1EBFu \u0111\u1EC3 tr\u1ED1ng smtp.from thì h\u1EC7 th\u1ED1ng dùng smtp.username.
smtp.from=
smtp.fromName=Celine Closet
smtp.startTls=true
# Token reset ch\u1EC9 dùng \u0111\u01B0\u1EE3c m\u1ED9t l\u1EA7n.
passwordReset.expirationMinutes=15
# auto = t\u1EF1 nh\u1EADn localhost ho\u1EB7c Cloudflare URL hi\u1EC7n t\u1EA1i.
passwordReset.baseUrl=auto
# ======================== THÔNG TIN SHOP ========================
shop.hotline=0355122472
shop.email=hello@celineclosset.vn
shop.name=Celine Closet
shop.address=118/90/1 Liên Khu 5-6, Khu ph\u1ED1 33, Ph\u01B0\u1EDDng Bình Tân, TP.HCM, Vi\u1EC7t Nam

# T\u1ECDa \u0111\u1ED9 c\u1EEDa hàng.
shop.latitude=10.8187500
shop.longitude=106.5963500
shop.facebook=https://www.facebook.com/
shop.instagram=https://www.instagram.com/
shop.tiktok=https://www.tiktok.com/
shop.youtube=https://www.youtube.com/

# ======================== TÀI KHO\u1EA2N NGÂN HÀNG SHOP ========================
shop.bankName=TPBank
shop.bankCode=970423
shop.bankAccount=
shop.bankOwner=
shop.qrImage=assets/images/payment/shop-qr-demo.png
# ======================== THANH TOÁN VIETQR ========================
vietqr.quickLinkBase=https://img.vietqr.io/image
vietqr.template=compact2
# Ví d\u1EE5:
# \u0111\u01A1n 1  -> DH00001
# \u0111\u01A1n 45 -> DH00045
payment.codePrefix=DH
payment.codeDigits=5
# QR h\u1EBFt h\u1EA1n sau 10 phút.
payment.expirationMinutes=10
# Server ki\u1EC3m tra các thanh toán h\u1EBFt h\u1EA1n m\u1ED7i 30 giây.
payment.expirationCheckSeconds=30
# ======================== SEPAY ========================
sepay.webhookEnabled=true
sepay.webhookApiKey=
# ======================== GEOAPIFY ========================
# G\u1EE3i ý \u0111\u1ECBa ch\u1EC9 + reverse geocoding.
geoapify.apiKey=
geoapify.autocompleteUrl=https://api.geoapify.com/v1/geocode/autocomplete
geoapify.reverseUrl=https://api.geoapify.com/v1/geocode/reverse
# ======================== LOCATIONIQ ========================
# D\u1ECBch v\u1EE5 d\u1EF1 phòng khi Geoapify l\u1ED7i/h\u1EBFt h\u1EA1n m\u1EE9c.
locationiq.apiKey=
locationiq.searchUrl=https://us1.locationiq.com/v1/search
locationiq.reverseUrl=https://us1.locationiq.com/v1/reverse
# ======================== OPENROUTESERVICE ========================
# API dùng \u0111\u1EC3 v\u1EBD tuy\u1EBFn shipper -> khách hàng.
openrouteservice.apiKey=
# Endpoint m\u1EDBi.
openrouteservice.directionsUrl=https://api.heigit.org/openrouteservice/v2/directions/driving-car/geojson
# ======================== KHÓA TUY\u1EBEN TRONG VI\u1EC6T NAM ========================
# M\u1EE5c tiêu: không cho xe \u0111i xuyên Lào/Campuchia/Trung Qu\u1ED1c.
routing.vietnamOnly=true
# ======================== OSRM ========================
# Ch\u1EC9 dùng khi:
# routing.vietnamOnly=false
# Khi vietnamOnly=true thì MapApiClient m\u1EDBi s\u1EBD không g\u1ECDi OSRM.
osrm.routeUrl=https://router.project-osrm.org/route/v1/driving/
# ======================== NOMINATIM ========================
# Không c\u1EA7n API key.
# Ch\u1EC9 dùng d\u1EF1 phòng cu\u1ED1i cùng cho tìm \u0111\u1ECBa ch\u1EC9.
nominatim.searchUrl=https://nominatim.openstreetmap.org/search
nominatim.reverseUrl=https://nominatim.openstreetmap.org/reverse
# ======================== OPENROUTER AI ========================
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.apiKey=
openrouter.model=google/gemma-4-26b-a4b-it:free
openrouter.promptResource=chatbot/celine-chatbox-system-prompt.txt
openrouter.connectTimeoutSeconds=15
openrouter.requestTimeoutSeconds=90
# AI tr\u1EA3 l\u1EDDi ng\u1EAFn v\u1EEBa ph\u1EA3i.
openrouter.maxTokens=900
openrouter.temperature=0.25
# S\u1ED1 tin nh\u1EAFn c\u0169 g\u1EEDi l\u1EA1i cho AI \u0111\u1EC3 nh\u1EDB ng\u1EEF c\u1EA3nh.
openrouter.historyLimit=30
# ======================== CHAT API C\u0168 ========================
chat.api.url=https://openrouter.ai/api/v1/chat/completions
# ======================== CHAT H\u1ED6 TR\u1EE2 ========================
# Sau 48 gi\u1EDD hai bên không nh\u1EAFn, cu\u1ED9c chat \u0111\u01B0\u1EE3c d\u1ECDn t\u1EF1 \u0111\u1ED9ng.
support.chat.autoDeleteHours=48
# Ki\u1EC3m tra cu\u1ED9c chat h\u1EBFt h\u1EA1n m\u1ED7i 60 phút.
support.chat.cleanupIntervalMinutes=60
# ======================== TR\u1EA2 HÀNG & HOÀN TI\u1EC0N ========================
# Khách \u0111\u01B0\u1EE3c yêu c\u1EA7u tr\u1EA3 hàng trong vòng 7 ngày sau khi hoàn thành.
return.requestDays=7
# Tài kho\u1EA3n ngân hàng nh\u1EADn hoàn ti\u1EC1n ch\u1EC9 s\u1EEDa trong 2 ngày \u0111\u1EA7u.
return.bankEditDays=2
# Th\u1EDDi gian d\u1EF1 ki\u1EBFn x\u1EED lý hoàn ti\u1EC1n.
return.refundProcessingDays=4